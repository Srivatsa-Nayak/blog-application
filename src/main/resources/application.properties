# Disable the banner
spring.main.banner-mode=console

# Use a custom banner file location
spring.banner.location=classpath:banner.txt

logging.level.org.springframework.security=INFO

# devtools prints a long "CONDITION EVALUATION DELTA" report on every restart, it is not an error
spring.devtools.restart.log-condition-evaluation-delta=false

# jwt properties
app.jwt-secret=${JWT_SECRET:daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb}
app-jwt-expiration-milliseconds=604800000

# default admin account, created on startup if it does not exist yet
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@blog.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# seed a few categories and posts when the database is empty
app.seed-demo-data=false

spring.jpa.open-in-view=true

# "local" uses an embedded H2 database, so no MySQL install is needed.
# Switch with SPRING_PROFILES_ACTIVE=dev|qa|prod|docker for MySQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
