# Embedded H2 database stored in ./data so posts survive restarts.
# Delete the ./data folder to start fresh.
spring.datasource.url=jdbc:h2:file:./data/blogdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

app.seed-demo-data=true
